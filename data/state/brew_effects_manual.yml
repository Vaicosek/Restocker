# ─────────────────────────────────────────────────────────────────────────────
# Curated brew  →  effect map   (hand-maintained)
#
# Source: the "brews" server  #recipes  forum (channel 1308041752573247538),
# read 2026-07-14. These are the authoritative effects for brews whose lore is
# pure flavour text (no parseable effect line), so the auto-parser can't name
# them. Entries here ALWAYS win over the auto-parser and are NEVER overwritten
# by the bot's learn/purge routines — this file is yours to edit.
#
# Matching is fuzzy on the brew's in-game name: colour/format codes (§, &),
# the trailing #variant-hash, fancy unicode (small-caps ꜱᴄʜɪᴢᴏ, math-bold
# 𝐵𝒾𝑔), case and punctuation are all ignored. So you only need ONE plain-text
# key per brew; add extra keys only when a brew ships under several names.
#
# Format:   "<brew name>": "<effects to show>"
# ─────────────────────────────────────────────────────────────────────────────
