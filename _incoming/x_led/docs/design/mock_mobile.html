<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V Tech — mobile (390px)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   V TECH — MOBILE. Same product, 390px viewport.
   CSS block below is mock_hub.html's, reused as-is, plus a
   PHONE RIG section at the bottom. The only thing genuinely
   redesigned is the money strip: on 390px it becomes two rows
   that condense to one on scroll — the held breakdown is moved,
   never hidden. All data fake, in-memory. No storage APIs.
   ============================================================ */
:root{
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --font-ui:'Space Grotesk',system-ui,sans-serif;
  --bg:#080808;--surface:#0f0f0f;--panel2:#151515;--border:#1E1E1E;--border-strong:#2A2A2A;
  --text:#F4F4F4;--text-body:#B4B4B4;--muted:#6a6a6a;--faint:#3f3f3f;
  --green:#22FF7A;--green-dim:#0f7a3a;--accent:#22FF7A;--red:#FF4D4D;--amber:#F5A623;--blue:#4A9EFF;--purple:#B47FFF;--nether:#FF6B35;
}
:root{
  /* money roles map onto the house palette */
  --money-available:var(--text);
  --money-held:var(--amber);
  --money-debt:var(--red);
  --money-save:var(--green);
  --headh:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);background-image:radial-gradient(#151515 .5px,transparent .5px);background-size:24px 24px;color:var(--text);font-family:var(--font-ui);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.mono,td,.num,input,.pill,.tag,.val,.fv,.tick,.o-odds,.lot-bid,.hold-amt,.kfig,.big{font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(34,255,122,.22)}
svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- page header (desktop chrome around the rig) ---------- */
header{position:sticky;top:0;z-index:90;height:var(--headh);background:rgba(15,15,15,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-icon{width:30px;height:30px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;font-size:16px;box-shadow:0 0 24px rgba(34,255,122,.4)}
.logo-text{font-size:14px;font-weight:600}
.logo-sub{font-family:var(--font-data);font-size:8.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.18em}
.header-right{display:flex;align-items:center;gap:12px}
.user-tag{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--border)}
.user-mark{width:22px;height:22px;border:1px solid var(--border-strong);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--font-data);font-size:9.5px;color:var(--text-body)}
.auth-name{font-family:var(--font-data);color:var(--accent);font-weight:500;font-size:12px}
.svc-note{font-family:var(--font-data);font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}

/* ---------- held drawer (verbatim from mock_hub) ---------- */
.drawer{max-height:0;overflow:hidden;transition:max-height .22s ease;border-top:1px solid transparent}
.mstrip.open .drawer{max-height:520px;border-top-color:var(--border)}
.drawer-inner{padding:12px 14px 14px}
.drawer-head{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:10px}
.drawer-head::after{content:"";flex:1;height:1px;background:var(--border)}
.hold-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--border);background:var(--panel2);margin-bottom:6px;transition:border-color .12s,transform .12s;cursor:pointer}
.hold-row:hover{border-color:var(--border-strong)}
.hold-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.hold-main{flex:1;min-width:0}
.hold-t{font-size:12.5px;font-weight:500;display:block}
.hold-s{font-size:10.5px;color:var(--muted);display:block}
.hold-amt{font-size:14px;font-weight:600;color:var(--money-held);white-space:nowrap}
.hold-go{color:var(--faint);display:flex}
.drawer-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:9px;margin-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.drawer-foot b{color:var(--money-held);font-size:13px;font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero}

/* ---------- layout ---------- */
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0}
.page-sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.section-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:24px 0 12px;display:flex;align-items:center;gap:10px;font-weight:600}
.section-h::after{content:"";flex:1;height:1px;background:var(--border)}
.tile-h{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:4px}
.q{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.t-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em}

.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);padding:18px 20px;position:relative}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s6{grid-column:span 6}
.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}

/* hub cards */
.hubcard{border-top:2px solid var(--accent-c);cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:border-color .12s,background .12s}
.hubcard:hover{background:var(--panel2)}
.hubcard .hc-name{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.hubcard .hc-name svg.i{color:var(--accent-c)}
.figs{display:flex;border-top:1px solid var(--border);padding-top:12px;margin-top:auto}
.fig{flex:1;padding-right:10px;min-width:0}
.fig .fv{font-size:17px;font-weight:600;letter-spacing:-.01em}
.fig .fl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.hubcard .go{font-size:11px;color:var(--text-body);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}

/* kpi */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--panel2);border:1px solid var(--border);padding:13px 14px}
.kpi .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.kpi .kfig{font-size:20px;font-weight:600;margin-top:5px}
.kpi .kt{font-size:10px;color:var(--muted);margin-top:3px}

/* generic bits */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-size:11px;border:1px solid var(--border);color:var(--text-body);white-space:nowrap}
.pill.good{border-color:rgba(34,255,122,.3);color:var(--green)}
.pill.warn{border-color:rgba(245,166,35,.3);color:var(--amber)}
.pill.crit{border-color:rgba(255,77,77,.3);color:var(--red)}
.pill.mine{border-color:rgba(74,158,255,.35);color:var(--blue)}
.up{color:var(--green)}.down{color:var(--red)}
.muted{color:var(--muted)}.sec{color:var(--text-body)}.amb{color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#000;border:none;padding:8px 14px;font-family:var(--font-ui);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.btn:hover{background:#4dff96}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-body)}
.btn.ghost:hover{background:var(--panel2);border-color:var(--border-strong);color:var(--text)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:10px}
.btn .coin{text-transform:none;color:inherit;opacity:.65}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrapf{flex-wrap:wrap}
.right{text-align:right}

/* tables */
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border)}
th,td{padding:9px 13px;text-align:right;border-bottom:1px solid var(--border);font-size:12.5px}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:.05em;user-select:none}
tbody tr:hover{background:var(--panel2)}
tr:last-child td{border-bottom:none}
.tick{font-weight:600;letter-spacing:.02em}
.tname{font-size:10.5px;color:var(--muted);font-family:var(--font-ui)}

/* bars */
.bar{height:6px;background:var(--panel2);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#17b558)}

/* outcomes */
.outcome{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:10px 12px;border:1px solid var(--border);background:var(--panel2);margin-bottom:8px;transition:border-color .12s}
.outcome.mine{border-color:rgba(74,158,255,.4)}
.o-name{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.o-right{text-align:right;font-size:12px;white-space:nowrap}
.o-odds{font-weight:600}
.o-barwrap{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:4px}
.o-barwrap .bar{flex:1}
.o-pct{font-size:10.5px;color:var(--muted);width:34px;text-align:right;font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero}

/* money-flow bits reused in sheets */
.amount-wrap{position:relative;margin-bottom:10px}
.amount{width:100%;padding:12px 14px 12px 38px;font-size:22px;font-weight:600;background:var(--bg);border:1px solid var(--border);color:var(--text);outline:none;letter-spacing:-.01em;font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero}
.amount:focus{border-color:var(--accent)}
.amount-wrap .cn{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;font-family:var(--font-data)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 9px;border:1px solid var(--border);background:var(--panel2);font-size:11px;font-weight:500;color:var(--text-body);font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.err{color:var(--red);font-size:11.5px;min-height:18px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
.kv:last-of-type{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;white-space:nowrap;text-align:right}
.kv.total{border-top:1px solid var(--border);border-bottom:none;margin-top:6px;padding-top:12px;font-size:13.5px}
.notebox{margin-top:14px;padding:10px 12px;font-size:11px;line-height:1.55;background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.25);color:#d9ae6a}
.notebox.blue{background:rgba(74,158,255,.06);border-color:rgba(74,158,255,.25);color:#9dc3f0}
.okbox{margin-top:14px;padding:11px 12px;font-size:11.5px;line-height:1.55;background:rgba(34,255,122,.06);border:1px solid rgba(34,255,122,.25);color:#8fe0b2}
.big-ok{width:40px;height:40px;background:rgba(34,255,122,.08);border:1px solid rgba(34,255,122,.35);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--green)}
.big-ok svg{width:20px;height:20px}
.step-dots{display:flex;gap:6px;align-items:center}
.sd{width:6px;height:6px;border-radius:50%;background:var(--border-strong);display:inline-block}
.sd.on{background:var(--accent)}
.sd.done{background:var(--green-dim)}
.big{font-size:24px;font-weight:600;letter-spacing:-.02em}
.ref{font-family:var(--font-data);font-size:11px;color:var(--text-body)}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:rgba(245,166,35,.22)}100%{background:transparent}}
.empty{padding:14px 0;color:var(--muted);font-size:12px}
.foot{color:var(--faint);font-size:11px;margin-top:12px;line-height:1.5}
.coin{font-family:var(--font-data);font-size:.62em;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.x{color:var(--muted);display:flex;padding:2px}
.x:hover{color:var(--text)}

/* ============================================================
   PHONE RIG — everything below is mobile-specific.
   ============================================================ */
.rigwrap{max-width:1400px;margin:0 auto;padding:20px 24px 60px}
.rignote{color:var(--muted);font-size:12.5px;max-width:720px;margin-bottom:20px}
.rigs{display:flex;flex-wrap:wrap;gap:22px}
.rig{width:390px;max-width:100%;display:flex;flex-direction:column;gap:8px}
.rig-cap{display:flex;gap:9px;align-items:baseline}
.rig-n{font-family:var(--font-data);font-size:10px;color:#000;background:var(--accent);padding:1px 5px;font-weight:600;flex:0 0 auto}
.rig-t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.rig-note{font-size:11.5px;color:var(--text-body);line-height:1.45;min-height:34px}
.rig-dim{font-family:var(--font-data);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.14em}

@media(max-width:620px){
  header{padding:0 14px}
  .svc-note,.user-tag{display:none}
  .rigwrap{padding:16px 14px 40px}
  .rigs{gap:26px}
}
.phone{position:relative;overflow:hidden;height:844px;background:var(--bg);border:1px solid var(--border-strong);display:flex;flex-direction:column}
@media(max-width:430px){.phone{height:640px}}
.devbar{height:24px;flex:0 0 auto;background:#050505;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:var(--font-data);font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.devbar .dvr{display:flex;align-items:center;gap:6px}
.batt{width:18px;height:9px;border:1px solid var(--faint);padding:1px;display:flex}
.batt i{flex:1;background:var(--muted)}

.phead{height:42px;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;padding:0 12px}
.pmark{width:22px;height:22px;background:var(--accent);color:#000;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pname{font-size:13px;font-weight:600;letter-spacing:-.01em}
.puser{margin-left:auto;font-size:11px;color:var(--accent)}
.pback{display:flex;align-items:center;gap:8px;color:var(--text-body);font-size:12.5px;font-weight:500}
.pback:hover{color:var(--text)}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.body{padding:14px 14px 24px;animation:f .22s ease}

/* ---------- MOBILE MONEY STRIP ----------
   Four figures on 390px: available and net share the top line,
   held and savings share the second (which is the drawer toggle),
   a 3px proportion bar sits between them. On scroll the whole
   thing collapses to one 34px line that still carries held and
   still opens the same drawer. */
.mstrip{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.ms-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 14px 8px}
.ms-lab{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.ms-a .ms-val{font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero;font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.05;color:var(--money-available)}
.ms-n{text-align:right}
.ms-n .ms-val{font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero;font-size:15px;font-weight:600;line-height:1.2;color:var(--text)}
.ms-a .ms-sub{font-size:10px;color:var(--muted);margin-top:2px}
.ms-bar{display:flex;gap:2px;height:3px;margin:0 14px}
.ms-bar i{display:block;height:100%}
.ms-row{width:100%;display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:38px;border-top:1px solid var(--border);text-align:left}
.ms-row:hover{background:var(--panel2)}
.ms-k{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.ms-k b{font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero;font-size:13px;letter-spacing:0;text-transform:none}
.ms-k.held b{color:var(--money-held)}
.ms-k.save b{color:var(--money-save)}
.ms-k .cnt{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;font-family:var(--font-data)}
.ms-row .chev{margin-left:auto;display:inline-flex;color:var(--money-held);transition:transform .18s ease}
.ms-row .chev svg{width:13px;height:13px}
.mstrip.open .chev{transform:rotate(180deg)}
.ms-mini{display:none;width:100%;align-items:center;gap:10px;padding:0 14px;height:34px;text-align:left}
.ms-mini:hover{background:var(--panel2)}
.ms-mini .mm-l{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ms-mini .mm-v{font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ms-mini .mm-held{color:var(--money-held)}
.phone.cond .mstrip:not(.open) .ms-mini{display:flex}
.phone.cond .mstrip:not(.open) .ms-top,
.phone.cond .mstrip:not(.open) .ms-row{display:none}

/* mobile drawer rows: two lines, amount top-right, nothing truncated */
.phone .hold-row{display:grid;grid-template-columns:8px 1fr auto;gap:3px 10px;align-items:start;padding:9px 11px}
.phone .hold-dot{margin-top:5px}
.phone .hold-t{font-size:12px;line-height:1.35}
.phone .hold-amt{grid-column:3;grid-row:1;font-size:13px;line-height:1.35}
.phone .hold-s{grid-column:2/4;font-size:10px;line-height:1.45}
.phone .hold-go{display:none}
.phone .drawer-foot{flex-direction:column;align-items:flex-start;gap:6px;font-size:10.5px;line-height:1.45}

/* ---------- bottom tab bar ---------- */
.tabbar{flex:0 0 auto;height:54px;display:flex;background:var(--surface);border-top:1px solid var(--border)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);border-top:2px solid transparent;margin-top:-1px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tb svg.i{width:17px;height:17px;opacity:.7}
.tb[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tb[aria-current="true"] svg.i{opacity:1}

/* ---------- phone-scale overrides of the shared components ---------- */
.phone h1{font-size:17px}
.phone .page-sub{font-size:11.5px}
.phone .section-h{margin:18px 0 10px}
.phone .tile{padding:13px 14px}
.phone .bento{gap:10px;margin-bottom:10px}
.phone .s3,.phone .s4,.phone .s5,.phone .s6,.phone .s7{grid-column:span 12}
.phone .kgrid{gap:10px}
.phone th,.phone td{padding:8px 10px;font-size:12px}
.phone th{font-size:9.5px;letter-spacing:.06em}
.phone .fig .fv{font-size:15px}
.phone .outcome{padding:9px 10px}
.phone .outcome .bar{background:var(--bg)}
.phone .o-name{font-size:12px;gap:6px}
.phone .o-barwrap{gap:8px}
.phone .btn{padding:9px 14px}
.phone .btn.sm{padding:6px 9px}
.listrow{display:grid;grid-template-columns:1fr auto;gap:3px 10px;width:100%;text-align:left;align-items:start;padding:9px 11px;border:1px solid var(--border);background:var(--panel2);margin-bottom:6px}
.listrow:hover{border-color:var(--border-strong)}
.listrow .hold-t{font-size:12px;line-height:1.35}
.lr-amt{font-size:12.5px;font-weight:600;color:var(--text-body);white-space:nowrap}
.tsub{font-size:10px;color:var(--muted);font-family:var(--font-ui);margin-top:1px}
.halfsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statline{display:flex;gap:0;border:1px solid var(--border);background:var(--surface)}
.statline > div{flex:1;padding:10px 12px;border-left:1px solid var(--border)}
.statline > div:first-child{border-left:none}
.statline .sl-l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.statline .sl-v{font-family:var(--font-data);font-variant-numeric:tabular-nums slashed-zero;font-size:16px;font-weight:600;margin-top:3px}
.segbar{display:flex;border:1px solid var(--border);margin-bottom:12px}
.segbar button{flex:1;padding:8px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);border-left:1px solid var(--border)}
.segbar button:first-child{border-left:none}
.segbar button[aria-current="true"]{background:var(--panel2);color:var(--accent)}

/* ---------- bottom sheet ---------- */
.sheet-scrim{position:absolute;inset:0;z-index:60;background:rgba(4,4,4,.72);display:none;align-items:flex-end}
.sheet-scrim.on{display:flex}
.sheet{width:100%;max-height:86%;background:var(--surface);border-top:1px solid var(--border-strong);display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-head h3{font-size:13px;font-weight:600;letter-spacing:-.01em}
.sheet-head .sh-sub{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.sheet-body{padding:14px;overflow-y:auto}
.sheet-foot{padding:11px 14px;border-top:1px solid var(--border);display:flex;gap:9px}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.wide{flex:1.5}
.deltabox{margin-top:14px;padding:11px 12px;border:1px solid var(--border);background:var(--panel2)}
.deltabox .kv{padding:4px 0;border:none;font-size:12px}
.arrowto{color:var(--muted);margin:0 4px}

/* motion communicates state; if the reader has asked for less, it stops */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">V</div>
    <div><div class="logo-text">V Tech Hub — mobile</div><div class="logo-sub">390 × 844 · same density</div></div>
  </div>
  <div class="header-right">
    <span class="svc-note">Markets · Banking · Estates</span>
    <span class="user-tag"><span class="user-mark">GH</span><span class="auth-name">@GreyHames</span></span>
  </div>
</header>

<div class="rigwrap">
  <div class="rignote">Six live phone viewports. They share one in-memory wallet — stake in frame 05 and
  every strip on this page moves. Scroll inside a frame: the money strip condenses rather than disappearing.</div>
  <div class="rigs" id="rigs"></div>
</div>

<script>
/* ================================================================
   ICONS — inline lucide-style strokes. No emoji anywhere.
   ================================================================ */
const svg = d => '<svg class="i" viewBox="0 0 24 24">' + d + '</svg>';
const IC = {
  hub:     svg('<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>'),
  markets: svg('<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>'),
  banking: svg('<path d="M3 21h18M4 10h16M12 3l9 5H3zM6 10v11M10 10v11M14 10v11M18 10v11"/>'),
  estates: svg('<path d="M9 4L3 7v13l6-3 6 3 6-3V4l-6 3z"/><path d="M9 4v13M15 7v13"/>'),
  arrow:   svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  back:    svg('<path d="M19 12H5M11 18l-6-6 6-6"/>'),
  down:    svg('<path d="M6 9l6 6 6-6"/>'),
  check:   svg('<path d="M20 6L9 17l-5-5"/>'),
  close:   svg('<path d="M18 6L6 18M6 6l12 12"/>')
};

/* ================================================================
   CONFIG + integer coin math (identical to the desktop hub)
   ================================================================ */
const CFG = { RAKE_BPS: 500 };
const rakePct = () => (CFG.RAKE_BPS/100).toFixed(CFG.RAKE_BPS%100?2:0) + '%';
const rakeOn  = pool => Math.floor(pool * CFG.RAKE_BPS / 10000);
const netPool = pool => pool - rakeOn(pool);
const n  = v => v.toLocaleString('en-US');
const cn = v => n(v) + '<span class="coin">c</span>';

/* ----------------------------------------------------------------
   FORMAT — integer coins, human dates. ISO lives in TODAY, in
   idempotency keys and in .ref strings. It is never rendered.
   Same helper as mock_banking.html:409 and mock_hub.html.
   ---------------------------------------------------------------- */
const TODAY = '2026-08-13';
const NOW   = '13 Aug 2026 19:42';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const D    = iso => new Date(iso + 'T00:00:00Z');
const fmtD = s => { const d = D(s); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };

/* ================================================================
   STATE — in-memory only. No storage APIs.
   ================================================================ */
const S = {
  user:'GreyHames',
  wallet:{ available:48200, savings:90000 },
  /* Four live holds, 46,700c. Ordered by amount descending —
     the drawer is scanned, not read. */
  holds:[
    {id:'h_405', amount:31000, color:'var(--amber)',
     title:'Auction #405 — Ironvale Watchtower',
     sub:'you won · settle stuck on attempt 3 of 5 · retry in 2m 10s',
     go:'positions'},
    {id:'h_412', amount:8000, color:'var(--nether)',
     title:'Auction #412 — Riverside Parcel R-12',
     sub:'you are the high bidder · closes in 5h 12m · expires close + 24h',
     go:'positions'},
    {id:'h_77', amount:4500, color:'var(--purple)',
     title:'Bet — Mockrean election',
     sub:'4,500 on Verrin Hald · resolves in 2d 04h · expires resolve + 7d',
     go:'market'},
    {id:'h_423', amount:3200, color:'var(--blue)',
     title:'Auction #423 — Skyport Dock 7',
     sub:'you are the high bidder · closes in 22h 04m · expires close + 24h',
     go:'positions'}
  ],
  stocks:[
    {t:'VTEC', name:'V Tech Industries', px:1240, chg:2.4,  qty:18},
    {t:'HIVE', name:'Apiary Collective', px:96,   chg:5.1,  qty:250},
    {t:'QRTZ', name:'Quartz Mining Co',  px:480,  chg:-1.2, qty:40},
    {t:'OSNT', name:'Osentar Holdings',  px:2150, chg:0.6,  qty:4},
    {t:'RAIL', name:'Redstone Rail',     px:610,  chg:-3.4, qty:0}
  ],
  shops:{open:7, restockDue:2, weekRevenue:31450},
  bank:{
    /* Savings is credited monthly on the 13th at APR/12, floored.
       240 = floor(90,000 × 3.2% ÷ 12), paid today.
       Lifetime is the ladder 106+146+186+208+240 across five credits. */
    savings:90000, apr:3.2, accruedMonth:240, accruedLifetime:886,
    lastPaid:'2026-08-13', nextPay:'2026-09-13',
    /* Loan #9 — 25,000 over 12 weekly rests from 9 Jul 2026.
       per = floor(25000/12) = 2,083; the 4c remainder rides on row 12.
       Rows 1–5 paid (principal 10,415, interest 130). Row 6 is due today.
       Derived, never stored: outstanding 14,585 · payoff today 14,603. */
    loan:{id:9, principal:25000, paidPrincipal:10415, intPaid:130, paidCount:5,
          apr:6.5, terms:12, termLabel:'12 weekly',
          lastPaidOn:'2026-08-06', lastPaidAmt:2104,
          nextDue:'2026-08-13', nextAmt:2101, nextIdx:6, remainingCount:7},
    /* Locked capital. NOT escrow, NOT counted in the net position. */
    bonds:[
      {id:'B-201', face:10000, apr:4.0, matures:'2026-09-01', days:19,  interest:98,  payout:10098},
      {id:'B-207', face:15000, apr:4.5, matures:'2026-11-15', days:94,  interest:332, payout:15332},
      {id:'B-212', face:8000,  apr:5.0, matures:'2027-02-01', days:172, interest:295, payout:8295},
      {id:'B-219', face:12000, apr:5.5, matures:'2027-08-01', days:353, interest:660, payout:12660}
    ]
  },
  /* His three auction positions — the lots that generate the auction holds.
     31,000 + 8,000 + 3,200 = 42,200; + the 4,500 bet = 46,700 held. */
  lots:[
    {id:405, t:'Ironvale Watchtower',   cat:'Build · stone · 3 floors', seller:'Ironvale Guild',
     bid:31000, bids:4, closes:'closed today 13:02', mine:true, state:'settling', c:'var(--amber)'},
    {id:412, t:'Riverside Parcel R-12', cat:'Land · 64×64 · Riverside', seller:'Osentar Estates',
     bid:8000,  bids:5, closes:'5h 12m',  mine:true, state:'open', c:'var(--nether)'},
    {id:423, t:'Skyport Dock 7',        cat:'Commercial plot · 32×32',  seller:'V Tech Logistics',
     bid:3200,  bids:1, closes:'22h 04m', mine:true, state:'open', c:'var(--blue)'}
  ],
  market:{
    id:77, q:'Mockrean election — who takes the chancellery?', closes:'2d 04h', state:'open',
    outcomes:[
      {k:'verrin', n:'Verrin Hald', pool:42000, mine:4500},
      {k:'osric',  n:'Osric Vane',  pool:28500, mine:0},
      {k:'tam',    n:'Tamsin Roe',  pool:9500,  mine:0}
    ]
  },
  otherMarkets:[
    {id:81, q:'Will VTEC close above 1,300 on 1 Sep?', pool:50000, closes:'19d', legs:2},
    {id:84, q:'First guild to claim Ashfell?',         pool:28100, closes:'6d 11h', legs:4}
  ],
  /* Settled figures are FINAL — they never carry the "indicative" label.
     Market #71 is voided, not settled, and he had no position in it.
     `res` is ONE thing on every row: coins RETURNED TO THE WALLET, never a
     signed profit. A lost stake returns 0. A refunded bid returns the stake
     in full. Net per row is always res − stake, so nothing needs a special
     case and no row can double-count its own loss. */
  settled:[
    {t:'Market #68 — VTEC above 1,150 on 1 Aug', o:'Yes',    stake:2000,  res:3180,  when:'1 Aug 2026',  win:true},
    {t:'Market #79 — VTEC above 1,200 on 1 Aug', o:'No',     stake:1500,  res:0,     when:'1 Aug 2026',  win:false},
    {t:'Lot #398 — Emberwatch Freehold',         o:'Outbid', stake:43000, res:43000, when:'11 Aug 2026', refund:true}
  ]
};

/* ================================================================
   DERIVED — never stored
   ================================================================ */
const held        = () => S.holds.reduce((a,h)=>a+h.amount,0);          // 46,700
const balance     = () => S.wallet.available + held();                   // 94,900
const outstanding = () => S.bank.loan.principal - S.bank.loan.paidPrincipal; // 14,585
/* A figure called "net" is only true once what he owes comes off it.
   The drawer foot names every term, so nothing is folded away. */
const netPos = () => S.wallet.available + held() + S.wallet.savings - outstanding(); // 170,315
const M = S.market;
const poolOf = m => m.outcomes.reduce((a,o)=>a+o.pool,0);
const oddsOf = (m,o) => o.pool>0 ? (netPool(poolOf(m))/o.pool) : 0;

/* ================================================================
   MONEY STRIP — the mobile answer.
   Row 1 available + net · 3px proportion bar · row 2 held + savings
   (also the drawer toggle) · condensed one-liner when scrolled.
   ================================================================ */
function stripHTML(){
  const h = held(), a = S.wallet.available, s = S.wallet.savings;
  const parts = [[a,'var(--text-body)'],[h,'var(--amber)'],[s,'var(--green)']];
  const rows = S.holds.length
    ? S.holds.map(x=>`
      <button class="hold-row" data-hold="${x.id}" onclick="holdTap(this,'${x.go}')">
        <span class="hold-dot" style="background:${x.color}"></span>
        <span class="hold-t">${x.title}</span>
        <span class="hold-amt num">${cn(x.amount)}</span>
        <span class="hold-s">${x.sub}</span>
      </button>`).join('')
    : '<div class="empty">No open holds. All of your coins are available.</div>';
  return `
  <button class="ms-mini" onclick="toggleDrawer(this)">
    <span class="mm-l">Avail</span><span class="mm-v">${cn(a)}</span>
    <span class="mm-l" style="margin-left:auto">Held</span><span class="mm-v mm-held">${cn(h)}</span>
    <span class="chev" style="margin-left:0;color:var(--money-held);display:inline-flex">${IC.down}</span>
  </button>

  <div class="ms-top">
    <div class="ms-a">
      <div class="ms-lab">Wallet · available</div>
      <div class="ms-val">${cn(a)}</div>
      <div class="ms-sub">spendable right now</div>
    </div>
    <div class="ms-n">
      <div class="ms-lab">Net position</div>
      <div class="ms-val">${cn(netPos())}</div>
    </div>
  </div>

  <div class="ms-bar">${parts.map(p=>`<i style="flex:${p[0]};background:${p[1]}"></i>`).join('')}</div>

  <button class="ms-row" onclick="toggleDrawer(this)" aria-expanded="false">
    <span class="ms-k held"><span class="hold-dot" style="background:var(--amber)"></span>Held
      <b>${cn(h)}</b><span class="cnt">· ${S.holds.length} hold${S.holds.length===1?'':'s'}</span></span>
    <span class="ms-k save"><span class="hold-dot" style="background:var(--green)"></span>Save
      <b>${cn(s)}</b></span>
    <span class="chev">${IC.down}</span>
  </button>

  <div class="drawer">
    <div class="drawer-inner">
      <div class="drawer-head">What is holding your coins</div>
      ${rows}
      <div class="drawer-foot">
        <span>Holds are escrow — the coins are yours until captured, and every hold has an expiry.</span>
        <span>Total held <b>${n(h)}</b>c · net subtracts the loan; bonds and land excluded</span>
      </div>
    </div>
  </div>`;
}
function toggleDrawer(el){
  const ms = el.closest('.mstrip');
  const open = ms.classList.toggle('open');
  const btn = ms.querySelector('.ms-row');
  if(btn) btn.setAttribute('aria-expanded', open);
}
function holdTap(el,go){
  const ph = el.closest('.phone');
  el.closest('.mstrip').classList.remove('open');
  setScreen(ph, go);
}
function renderStrips(flashId){
  document.querySelectorAll('.mstrip').forEach(ms=>{
    const wasOpen = ms.classList.contains('open');
    ms.innerHTML = stripHTML();
    ms.classList.toggle('open', wasOpen);
    if(flashId){
      const r = ms.querySelector('[data-hold="'+flashId+'"]');
      if(r) r.classList.add('flash');
    }
  });
}

/* ================================================================
   SCREENS
   ================================================================ */
function Hub(){
  const port = S.stocks.reduce((a,s)=>a+s.px*s.qty,0);
  const card = (c,icon,name,figs,tab)=>`
    <div class="tile hubcard s12" style="--accent-c:${c}" onclick="tabTap(this,'${tab}')">
      <div class="hc-name">${icon}${name}<span style="margin-left:auto;color:var(--faint);display:flex">${IC.arrow}</span></div>
      <div class="figs">${figs.map(f=>`<div class="fig"><div class="fv num${f[2]||''}">${f[0]}</div><div class="fl">${f[1]}</div></div>`).join('')}</div>
    </div>`;
  return `
  <div class="body">
    <h1>Hub</h1>
    <div class="page-sub">One wallet · ${S.holds.length} holds reserving <span class="num">${n(held())}</span>c · ${NOW}</div>
    <div class="section-h">Services</div>
    <div class="bento">
      ${card('var(--green)', IC.markets, 'Markets',
        [[cn(port),'Portfolio'],['+2.4%','VTEC 24h',' up'],[S.shops.restockDue,'Restocks due']],'markets')}
      ${card('var(--blue)', IC.banking, 'Banking',
        [[cn(S.bank.savings),'Savings'],[`<span style="color:var(--money-debt)">${cn(outstanding())}</span>`,'Loan left'],[S.bank.bonds.length,'Bonds']],'banking')}
      ${card('var(--purple)', IC.estates, 'Lands · Auctions · Betting',
        [[S.lots.length,'Your bids'],['1','Open bets'],[cn(held()),'Held',' amb']],'estates')}
    </div>
    <div class="section-h">Recent activity</div>
    <div class="tile s12" style="padding:6px 14px 10px">
      ${[
        ['var(--amber)', 'Hold placed · 31,000c', 'High bid on lot #405 — Ironvale Watchtower', '7 hours ago'],
        ['var(--purple)','Hold placed · 4,500c',  'Bet on Verrin Hald — market #77',            '3 hours ago'],
        ['var(--nether)','Hold placed · 8,000c',  'Outbid Tamsin Roe on lot #412',              '2 hours ago'],
        ['var(--green)', 'Interest paid · +240c', 'Savings accrual, ' + fmtD(S.bank.lastPaid),  'today'],
        ['var(--blue)',  'Sold 6 QRTZ · +2,880c', 'Stock exchange',                             'yesterday'],
        ['var(--red)',   'Loan payment · −2,104c','Loan #9, 5 of 12',                           '7 days ago']
      ].map(([c,t,s,w])=>`
        <div class="row" style="padding:9px 0;border-bottom:1px solid var(--border);gap:9px">
          <span class="hold-dot" style="background:${c}"></span>
          <span style="flex:1;min-width:0"><span style="font-size:12px;font-weight:500">${t}</span>
            <span class="hold-s">${s}</span></span>
          <span class="muted num" style="font-size:10px;white-space:nowrap">${w}</span>
        </div>`).join('')}
      <div class="foot">Every line above spends or reserves the same coins shown in the strip.</div>
    </div>
  </div>`;
}

function Markets(){
  const port = S.stocks.reduce((a,s)=>a+s.px*s.qty,0);
  return `
  <div class="body">
    <h1>Markets</h1>
    <div class="page-sub">Shops, exchange and hives · V Tech</div>
    <div class="statline" style="margin:14px 0 4px">
      <div><div class="sl-l">Portfolio</div><div class="sl-v">${cn(port)}</div></div>
      <div><div class="sl-l">Shops · 7d</div><div class="sl-v">${cn(S.shops.weekRevenue)}</div></div>
    </div>
    <div class="section-h">Exchange</div>
    <table>
      <thead><tr><th>Ticker</th><th>Price <span class="coin">c</span></th><th>24h</th><th>Value <span class="coin">c</span></th></tr></thead>
      <tbody>
      ${S.stocks.map(s=>`<tr>
        <td><span class="tick num">${s.t}</span><div class="tsub">${s.name}</div></td>
        <td class="num">${n(s.px)}</td>
        <td class="num ${s.chg>=0?'up':'down'}">${s.chg>=0?'+':''}${s.chg}%</td>

      </tr>`).join('')}
      </tbody>
    </table>
    <div class="foot">Holding column is folded into Value on this width — long-press a row on device for the full line.</div>
  </div>`;
}

function Banking(){
  const L = S.bank.loan, pctPaid = Math.floor(L.paidPrincipal*100/L.principal);
  const maxDays = Math.max(...S.bank.bonds.map(b=>b.days));
  return `
  <div class="body">
    <h1>Banking</h1>
    <div class="page-sub">Osentar Bank</div>
    <div class="section-h">Savings</div>
    <div class="tile s12">
      <div class="tile-h" style="margin-bottom:8px"><span>Balance</span><span class="pill good">${S.bank.apr}% APR</span></div>
      <div class="num" style="font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--money-save)">${cn(S.bank.savings)}</div>
      <div class="hold-s" style="margin-top:3px">+<span class="num">${n(S.bank.accruedMonth)}</span>c credited this month ·
        next credit ${fmtD(S.bank.nextPay)}</div>
      <div class="row" style="margin-top:12px"><button class="btn" style="flex:1">Deposit</button><button class="btn ghost" style="flex:1">Withdraw</button></div>
    </div>
    <div class="section-h">Loan #${L.id}</div>
    <div class="tile s12">
      <div class="between" style="align-items:baseline">
        <div class="num" style="font-size:22px;font-weight:600;color:var(--money-debt)">${cn(outstanding())}</div>
        <div class="muted" style="font-size:11px">of <span class="num">${n(L.principal)}</span>c · ${L.apr}% APR</div>
      </div>
      <div class="bar" style="margin:11px 0 7px"><i style="width:${pctPaid}%"></i></div>
      <div class="between hold-s"><span><span class="num">${n(L.paidPrincipal)}</span>c principal repaid · <span class="num">${pctPaid}%</span></span><span>${L.termLabel}</span></div>
      <div class="between" style="margin-top:12px;padding:10px 12px;border:1px solid var(--border);background:var(--panel2)">
        <div><div class="hold-s">Next payment · ${L.nextIdx} of ${L.terms}</div>
          <div class="num" style="font-weight:600;font-size:13px">${cn(L.nextAmt)} <span class="muted" style="font-weight:400;font-size:11px">due ${fmtD(L.nextDue)} — today</span></div>
          <div class="hold-s"><span class="num">${L.remainingCount}</span> payments left</div></div>
        <button class="btn sm">Pay early</button>
      </div>
      <div class="foot">Loan #${L.id} · outstanding <span class="num">${n(outstanding())}</span>c · subtracted from the net position in the strip.</div>
    </div>
    <div class="section-h">Bond ladder</div>
    <div class="tile s12" style="padding:6px 14px 12px">
      ${S.bank.bonds.map((b,i)=>{
        const colors=['var(--green)','var(--blue)','var(--purple)','var(--nether)'];
        const w = Math.max(6, Math.round(b.days*100/maxDays));
        return `<div style="display:grid;grid-template-columns:1fr 62px;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--border)">
          <div class="num" style="font-weight:600;font-size:12px">${b.id} <span class="muted" style="font-weight:400">${b.apr}% · ${n(b.face)}c</span></div>
          <div class="right num" style="font-weight:600;font-size:12px">${b.days} d</div>
          <div class="bar" style="grid-column:1/3"><i style="width:${w}%;background:${colors[i%4]}"></i></div>
          <div class="hold-s" style="grid-column:1/3">matures ${fmtD(b.matures)} · pays <span class="num">${n(b.payout)}</span>c</div>
        </div>`;
      }).join('')}
      <div class="foot">Bonds are locked capital until maturity and are not counted in the net position in the strip above.</div>
    </div>
  </div>`;
}

function outcomeRow(m,o,idx){
  const pool = poolOf(m);
  const pct = pool ? Math.round(o.pool*100/pool) : 0;
  const colors=['var(--blue)','var(--nether)','var(--purple)','var(--green)'];
  return `<div class="outcome ${o.mine?'mine':''}">
    <div class="o-name">
      <span class="hold-dot" style="background:${colors[idx%4]}"></span>${o.n}
      ${o.mine?`<span class="pill mine">yours ${n(o.mine)}c</span>`:''}
    </div>
    <div class="o-right"><span class="o-odds num">×${oddsOf(m,o).toFixed(2)}</span>
      <div class="hold-s">indicative</div></div>
    <div class="o-barwrap">
      <div class="bar"><i style="width:${pct}%;background:${colors[idx%4]}"></i></div>
      <span class="o-pct">${pct}%</span>
      <span class="hold-s num" style="width:56px;text-align:right">${n(o.pool)}c</span>
      <button class="btn sm ghost" onclick="openSheet(this,'${o.k}',1)">Stake</button>
    </div>
  </div>`;
}

function MarketScreen(){
  const m = M, pool = poolOf(m);
  return `
  <div class="body">
    <div class="eyebrow">Market #${m.id} · pari-mutuel</div>
    <div class="q" style="font-size:15px;line-height:1.35">${m.q}</div>
    <div class="row wrapf" style="gap:6px;margin:10px 0 4px">
      <span class="pill">closes in ${m.closes}</span>
      <span class="pill">pool ${n(pool)}c</span>
      <span class="pill">rake ${rakePct()}</span>
    </div>
    <div class="section-h">Outcomes <span class="muted" style="letter-spacing:0;text-transform:none;font-weight:400">odds indicative</span></div>
    ${m.outcomes.map((o,i)=>outcomeRow(m,o,i)).join('')}
    <div class="foot">Odds are <b>indicative</b> — pari-mutuel pools move until close, so your payout is set by
    the pool at close, not by the number shown when you stake.</div>
    <div class="section-h">Other open markets</div>
    ${S.otherMarkets.map(x=>`
      <button class="listrow">
        <span class="hold-t">#${x.id} — ${x.q}</span>
        <span class="lr-amt num">${n(x.pool)}c</span>
        <span class="hold-s" style="grid-column:1/3">${x.legs} outcomes · closes in ${x.closes}</span>
      </button>`).join('')}
    <button class="btn ghost" style="width:100%;margin-top:10px" onclick="tabTap(this,'positions')">My positions ${IC.arrow}</button>
  </div>`;
}

let posFilter = 'open';
function Positions(){
  const m = M, np = netPool(poolOf(m));
  const bet = m.outcomes.find(o=>o.mine>0);
  const betPayout = bet ? Math.floor(bet.mine*np/bet.pool) : 0;
  const seg = ['open','settled','voided'].map(k=>
    `<button aria-current="${k===posFilter}" onclick="setFilter(this,'${k}')">${k}</button>`).join('');
  let body;
  if(posFilter==='open'){
    body = `
    <div class="section-h">Bets</div>
    <table>
      <thead><tr><th>Outcome</th><th>Stake <span class="coin">c</span></th><th>If wins <span class="coin">c</span></th></tr></thead>
      <tbody>
        <tr><td>${bet.n}<div class="tsub">#${m.id} Mockrean · ${m.closes} left</div></td>
          <td class="num amb">${n(bet.mine)}</td>
          <td class="num up">${n(betPayout)}<div class="tsub">indicative</div></td></tr>
      </tbody>
    </table>
    <div class="foot">Indicative. Pari-mutuel odds move with every stake and are only final at close.</div>
    <div class="section-h">Auction bids</div>
    <table>
      <thead><tr><th>Lot</th><th>Your bid <span class="coin">c</span></th><th>Status</th></tr></thead>
      <tbody>
      ${S.lots.map(l=>`
        <tr><td>${l.t}<div class="tsub">Lot #${l.id} · ${l.cat} · ${l.bids} bids</div></td>
          <td class="num amb">${n(l.bid)}</td>
          <td>${l.state==='settling'
                ? '<span class="pill warn">settling</span><div class="tsub">closed today 13:02 · attempt 3 of 5</div>'
                : `<span class="pill mine">leading</span><div class="tsub">${l.closes} left</div>`}</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="statline" style="margin-top:14px">
      <div><div class="sl-l">Held by positions</div><div class="sl-v amb">${cn(held())}</div></div>
      <div><div class="sl-l">Bet · if Verrin wins</div><div class="sl-v up">${cn(betPayout)}</div>
        <div class="tsub">indicative</div></div>
    </div>
    <div class="foot">Held here always equals Held in the strip — ${S.holds.length} positions, ${n(held())}c reserved.
    Auction bids return in full if you are outbid. A bid is the price of the parcel, not a fee and not a return.</div>

    <div class="section-h">What happens next</div>
    <table>
      <thead><tr><th>Event · what happens to the hold</th><th>In</th></tr></thead>
      <tbody>
      ${S.lots.map(l=> l.state==='settling'
        ? `<tr><td>Lot #${l.id} settle retries<div class="tsub">hammer ${n(l.bid)}c · attempt 3 of 5 · the hold stays put until core answers, it is not released and not captured twice</div></td>
             <td class="num" style="white-space:nowrap;vertical-align:top">2m 10s</td></tr>`
        : `<tr><td>Lot #${l.id} closes<div class="tsub">high bid takes the parcel — your ${n(l.bid)}c is captured if you lead, released in full if outbid</div></td>
             <td class="num" style="white-space:nowrap;vertical-align:top">${l.closes}</td></tr>`).join('')}
        <tr><td>Market #${m.id} closes<div class="tsub">oracle proposes, a second confirm pays out — the hold runs to resolve + 7 days</div></td>
          <td class="num" style="white-space:nowrap;vertical-align:top">${m.closes}</td></tr>
      </tbody>
    </table>`;
  } else if(posFilter==='settled'){
    // derived, never a stored counter: what came back less what went out.
    // res is returned-to-wallet on EVERY row (0 on a loss, the full stake on a
    // refund), so one rule covers all three and a loss cannot be counted twice.
    const settledNet = S.settled.reduce((a,s)=> a + (s.res - s.stake), 0);   // −320
    body = `
    <div class="section-h">Settled</div>
    <table>
      <thead><tr><th>Market</th><th>Stake <span class="coin">c</span></th><th>Returned <span class="coin">c</span></th></tr></thead>
      <tbody>
      ${S.settled.map(s=>`<tr>
        <td>${s.t}<div class="tsub">${s.o} · ${s.when}</div></td>
        <td class="num">${n(s.stake)}</td>
        <td class="num ${s.refund?'muted':(s.win?'up':'down')}">${n(s.res)}
          ${s.refund?'<div class="tsub">refunded in full</div>':(s.win?'':'<div class="tsub">nothing returned</div>')}</td>
      </tr>`).join('')}
      </tbody>
    </table>
    <div class="foot">Returned is what came back to the wallet; Stake is what went out.
    Net across settled positions is Returned less Stake on every row —
    ${S.settled.map(s=>`(${n(s.res)} − ${n(s.stake)})`).join(' + ')} =
    <span class="num ${settledNet>=0?'up':'down'}">${settledNet<0?'−':'+'}${n(Math.abs(settledNet))}</span>c,
    after the ${rakePct()} rake and with the outbid lot refunded in full, so it nets zero.
    Settled — final, not indicative.</div>`;
  } else {
    body = `<div class="empty">No voided positions. Nothing has been refunded to you.</div>`;
  }
  return `
  <div class="body">
    <h1>My positions</h1>
    <div class="page-sub">Everything currently reserving coins</div>
    <div style="height:12px"></div>
    <div class="segbar">${seg}</div>
    ${body}
  </div>`;
}
function setFilter(el,k){ posFilter=k; setScreen(el.closest('.phone'),'positions'); }

/* ================================================================
   STAKE SHEET — amount → preview (figures + wallet delta) → receipt.
   Nothing moves until Confirm.
   ================================================================ */
const SCREENS = {hub:Hub, markets:Markets, banking:Banking, market:MarketScreen, positions:Positions};
const TABOF = {hub:'hub', markets:'markets', banking:'banking', market:'estates', positions:'estates'};

function flowOf(ph){ return ph._F; }
function openSheet(el,key,step,amount){
  const ph = el.closest ? el.closest('.phone') : el;
  ph._F = {key, step:step||1, amount: amount==null?'':String(amount)};
  renderSheet(ph);
}
function closeSheet(el){
  const ph = el.closest('.phone');
  ph._F = null;
  ph.querySelector('.sheetHost').innerHTML = '';
}
function amtInt(F){ return parseInt(F.amount||'0',10) || 0; }
function computed(F){
  const o = M.outcomes.find(x=>x.k===F.key), stake = amtInt(F);
  const poolAfter = poolOf(M) + stake, sideAfter = o.pool + stake;
  const np = netPool(poolAfter);
  const payout = Math.floor(stake * np / sideAfter);
  return {o, stake, poolAfter, sideAfter, rake:rakeOn(poolAfter), payout,
          odds: np/sideAfter, profit: payout - stake,
          newAvail: S.wallet.available - stake, newHeld: held() + stake};
}
function onAmt(el){
  const ph = el.closest('.phone'), F = ph._F;
  const raw = el.value.replace(/[^\d]/g,'');
  F.amount = raw;
  el.value = raw ? n(parseInt(raw,10)) : '';
  validate(ph);
}
function setAmt(el,v){
  const ph = el.closest('.phone'), F = ph._F;
  F.amount = String(v);
  const i = ph.querySelector('.amount');
  if(i) i.value = n(v);
  validate(ph);
}
function validate(ph){
  const F = ph._F, v = amtInt(F);
  const e = ph.querySelector('.err'), b = ph.querySelector('.toPreview');
  if(!e) return;
  e.textContent = v>0 && v>S.wallet.available ? `Only ${n(S.wallet.available)}c available. Held coins are not spendable.`
                : (v>0 && v<100 ? 'Minimum stake is 100c.' : '');
  b.disabled = !(v>=100 && v<=S.wallet.available);
}
function step2(el){ el.closest('.phone')._F.step = 2; renderSheet(el.closest('.phone')); }
function step1(el){ el.closest('.phone')._F.step = 1; renderSheet(el.closest('.phone')); }

function confirmStake(el){
  const ph = el.closest('.phone'), F = ph._F, c = computed(F);
  S.wallet.available -= c.stake;
  c.o.pool += c.stake; c.o.mine += c.stake;
  const hid = 'h_' + M.id + '_' + c.o.k;
  const ex = S.holds.find(h=>h.id===hid);
  if(ex){ ex.amount += c.stake; ex.sub = `${n(ex.amount)} on ${c.o.n} · resolves in ${M.closes} · expires resolve + 7d`; }
  else S.holds.push({id:hid, amount:c.stake, color:'var(--purple)',
    title:'Bet — Mockrean election',
    sub:`${n(c.stake)} on ${c.o.n} · resolves in ${M.closes} · expires resolve + 7d`, go:'market'});
  F.step = 3; F.receipt = c;
  renderSheet(ph);
  renderStrips(hid);
  // one wallet, one set of pools — every open frame re-reads the same state
  document.querySelectorAll('.phone').forEach(p=>{ if(p._screen) setScreen(p, p._screen); });
}

function renderSheet(ph){
  const host = ph.querySelector('.sheetHost'), F = ph._F;
  if(!F){ host.innerHTML=''; return; }
  const o = M.outcomes.find(x=>x.k===F.key);
  const dots = [1,2,3].map(i=>`<i class="sd ${F.step>i?'done':(F.step===i?'on':'')}"></i>`).join('');
  let title, sub, body, foot;

  if(F.step===1){
    title = 'Stake on ' + o.n; sub = 'Market #' + M.id + ' · pari-mutuel';
    body = `
      <div class="between" style="margin-bottom:10px">
        <span class="tile-h" style="margin:0">Available</span>
        <span class="num" style="font-weight:600">${cn(S.wallet.available)}</span>
      </div>
      <div class="amount-wrap"><span class="cn">c</span>
        <input class="amount" inputmode="numeric" placeholder="0" value="${F.amount?n(amtInt(F)):''}" oninput="onAmt(this)" autocomplete="off"></div>
      <div class="chips">
        ${[1000,2500,5000].map(v=>`<button class="chip" onclick="setAmt(this,${v})">${n(v)}c</button>`).join('')}
        <button class="chip" onclick="setAmt(this,${S.wallet.available})">MAX</button>
      </div>
      <div class="err"></div>
      <div class="kv"><span class="k">Side pool now</span><span class="v num">${cn(o.pool)}</span></div>
      <div class="kv"><span class="k">Total pool now</span><span class="v num">${cn(poolOf(M))}</span></div>
      <div class="kv"><span class="k">Indicative odds now</span><span class="v num">×${oddsOf(M,o).toFixed(2)}</span></div>`;
    foot = `<button class="btn ghost" onclick="closeSheet(this)">Cancel</button>
            <button class="btn wide toPreview" disabled onclick="step2(this)">Preview ${IC.arrow}</button>`;
  } else if(F.step===2){
    const c = computed(F);
    title = 'Preview — nothing has moved'; sub = `${n(c.stake)}c on ${o.n} · market #${M.id}`;
    body = `
      <div class="kv"><span class="k">Stake</span><span class="v num">${cn(c.stake)}</span></div>
      <div class="kv"><span class="k">Your side after</span><span class="v num">${cn(c.sideAfter)}</span></div>
      <div class="kv"><span class="k">Total pool after</span><span class="v num">${cn(c.poolAfter)}</span></div>
      <div class="kv"><span class="k">House rake (${rakePct()})</span><span class="v num">−${cn(c.rake)}</span></div>
      <div class="kv"><span class="k">Indicative odds after</span><span class="v num">×${c.odds.toFixed(2)}</span></div>
      <div class="kv total"><span class="k">Payout if <b>${o.n}</b> wins<br><span class="hold-s">at the current pool</span></span>
        <span class="v num" style="color:var(--green)">${cn(c.payout)}
          <div class="hold-s right" style="font-weight:400">profit +${n(c.profit)}c</div></span></div>
      <div class="deltabox">
        <div class="kv"><span class="k">Available after</span>
          <span class="v num">${cn(S.wallet.available)}<span class="arrowto">→</span><b>${cn(c.newAvail)}</b></span></div>
        <div class="kv"><span class="k">Held after</span>
          <span class="v num" style="color:var(--money-held)">${cn(held())}<span class="arrowto">→</span><b>${cn(c.newHeld)}</b></span></div>
      </div>
      <div class="notebox"><b>Odds float until close.</b> The payout above is what you would receive if the pool
        stopped moving right now. Rounding is floored to whole coins; the remainder stays in the pool.</div>`;
    foot = `<button class="btn ghost" onclick="step1(this)">${IC.back} Amount</button>
            <button class="btn wide" onclick="confirmStake(this)">Confirm ${cn(c.stake)}</button>`;
  } else {
    const c = F.receipt;
    title = 'Stake placed'; sub = 'Market #' + M.id;
    body = `
      <div class="big-ok">${IC.check}</div>
      <div style="text-align:center;margin-bottom:14px">
        <div class="num big">${cn(c.stake)}</div>
        <div class="sec" style="font-size:12px">held against <b>${o.n}</b></div>
      </div>
      <div class="kv"><span class="k">Hold reference</span><span class="v ref">estates:market:${M.id}:stake</span></div>
      <div class="kv"><span class="k">Available now</span><span class="v num">${cn(S.wallet.available)}</span></div>
      <div class="kv"><span class="k">Held now</span><span class="v num" style="color:var(--money-held)">${cn(held())}</span></div>
      <div class="kv"><span class="k">Hold expires</span><span class="v">resolve + 7 days</span></div>
      <div class="okbox">Your coins are <b>reserved, not spent</b>. If the market is voided you are refunded in
        full, with no rake.</div>`;
    foot = `<button class="btn ghost" onclick="closeSheet(this)">Done</button>
            <button class="btn wide" onclick="closeSheet(this);tabTap(this,'positions')">My positions</button>`;
  }

  host.innerHTML = `
    <div class="sheet-scrim on" onclick="if(event.target===this)closeSheet(this)">
      <div class="sheet" role="dialog" aria-modal="true">
        <div class="sheet-head">
          <div><h3>${title}</h3><div class="sh-sub">${sub}</div></div>
          <div class="row" style="gap:12px"><div class="step-dots">${dots}</div>
            <button class="x" onclick="closeSheet(this)" aria-label="Close">${IC.close}</button></div>
        </div>
        <div class="sheet-body">${body}</div>
        <div class="sheet-foot">${foot}</div>
      </div>
    </div>`;
  if(F.step===1){ validate(ph); const i=ph.querySelector('.amount'); if(i) setTimeout(()=>i.focus(),20); }
}

/* ================================================================
   PHONE RIG
   ================================================================ */
const TABS = [
  {k:'hub', label:'Hub', icon:IC.hub},
  {k:'markets', label:'Markets', icon:IC.markets},
  {k:'banking', label:'Banking', icon:IC.banking},
  {k:'estates', label:'Estates', icon:IC.estates}
];
function headHTML(screen){
  if(screen==='market' || screen==='positions'){
    const t = screen==='market' ? 'Market #'+M.id : 'My positions';
    return `<button class="pback" onclick="tabTap(this,'hub')">${IC.back}${t}</button>
            <span class="puser num">@GreyHames</span>`;
  }
  return `<div class="pmark">V</div><div class="pname">V Tech</div><span class="puser num">@GreyHames</span>`;
}
function setScreen(ph, key){
  ph._screen = key;
  ph.querySelector('.phead').innerHTML = headHTML(key);
  ph.querySelector('.view').innerHTML = SCREENS[key]();
  [...ph.querySelectorAll('.tb')].forEach(b=>b.setAttribute('aria-current', b.dataset.k===TABOF[key]));
  ph.querySelector('.screen').scrollTop = 0;
  ph.classList.remove('cond');
}
function tabTap(el,k){
  const ph = el.closest('.phone');
  setScreen(ph, k==='estates' ? 'market' : k);
}

const RIGS = [
  {n:'01', t:'Money strip · condensed', screen:'hub', scroll:230,
   note:'Scrolled: the four figures fall back to available + held on one 34px line — held keeps its tap target instead of being dropped.'},
  {n:'02', t:'Money strip · held open', screen:'hub', open:true,
   note:'Tapped: the held breakdown becomes full-width two-line rows, so titles, expiries and amounts all fit unclipped.'},
  {n:'03', t:'Hub · navigation', screen:'hub',
   note:'Nav moves to a thumb-reachable bottom bar; service cards go full-width so all three figures survive at 15px mono.'},
  {n:'04', t:'Prediction market', screen:'market',
   note:'Each outcome is two lines: name and odds, then bar, share, pool and the stake button on one baseline.'},
  {n:'05', t:'Stake · preview then confirm', screen:'market', sheet:{key:'osric', step:2, amount:2500},
   note:'Irreversible action is a bottom sheet: the wallet delta sits directly above the confirm button, not a screen away.'},
  {n:'06', t:'My positions', screen:'positions',
   note:'A real table at 390px — two mono columns on the right, context demoted to a 10px second line under the name.'}
];

rigs.innerHTML = RIGS.map(r=>`
  <figure class="rig">
    <figcaption>
      <div class="rig-cap"><span class="rig-n">${r.n}</span><span class="rig-t">${r.t}</span></div>
      <div class="rig-note">${r.note}</div>
    </figcaption>
    <div class="phone">
      <div class="devbar"><span>9:41</span>
        <span class="dvr"><span>V TECH</span><span class="batt"><i></i></span></span></div>
      <div class="phead"></div>
      <div class="screen">
        <div class="mstrip"></div>
        <div class="view"></div>
      </div>
      <div class="tabbar">${TABS.map(t=>`<button class="tb" data-k="${t.k}" onclick="tabTap(this,'${t.k}')">${t.icon}${t.label}</button>`).join('')}</div>
      <div class="sheetHost"></div>
    </div>
    <div class="rig-dim">390 × 844 · viewport</div>
  </figure>`).join('');

document.querySelectorAll('.phone').forEach((ph,i)=>{
  const r = RIGS[i], scr = ph.querySelector('.screen');
  ph.querySelector('.mstrip').innerHTML = stripHTML();
  setScreen(ph, r.screen);
  scr.addEventListener('scroll', ()=>{ ph.classList.toggle('cond', scr.scrollTop > 44); }, {passive:true});
  if(r.open) ph.querySelector('.mstrip').classList.add('open');
  if(r.scroll){ scr.scrollTop = r.scroll; ph.classList.add('cond'); }
  if(r.sheet){ ph._F = {key:r.sheet.key, step:r.sheet.step, amount:String(r.sheet.amount)}; renderSheet(ph); }
});
</script>
</body>
</html>
